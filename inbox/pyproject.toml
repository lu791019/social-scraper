[project]
name = "social-scraper-inbox"
version = "0.1.0"
description = "Cloud Run 收件服務：LINE webhook → Supabase 佇列；Mac 工作程式用 HTTPS 拉單"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
